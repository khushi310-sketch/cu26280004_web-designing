<!DOCTYPE html>
<html>
<head>
    <title>Employee Evaluation</title>

<style>
body {
    font-family: Arial;
}

form {
    width: 500px;
    margin: 30px ;
}

.field {
    margin-bottom: 15px;
}

label {
    float: left;
    width: 150px;
}

input, select {
    padding: 8px;
    width: 250px;
}

.clear {
    clear: both;
}

button {
    margin-top: 15px;
    padding: 10px;
}
</style>

</head>
<body>

<h1>Employee Evaluation</h1>

<form>

    <div class="field">
        <label>Employee Name:</label>
        <input type="text">
    </div>

    <div class="clear"></div>

    <div class="field">
        <label>Department:</label>
        <input type="text">
    </div>

    <div class="clear"></div>

    <div class="field">
        <label>Performance:</label>

        <select>
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
        </select>
    </div>

    <div class="clear"></div>

    <button type="submit">Submit Evaluation</button>

</form>

</body>
</html>
