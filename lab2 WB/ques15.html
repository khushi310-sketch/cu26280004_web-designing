<!DOCTYPE html>
<html>
<head>
    <title>Search Box</title>

<style>
body {
    font-family: Arial;
}

.search {
    width: 200px;
    padding: 12px;
    border: 1px solid gray;
    transition: width 0.5s;
}

.search:focus {
    width: 400px;
    outline: none;
    border-color: blue;
}
</style>

</head>
<body>

<h1>Search</h1>

<input type="text"
       class="search"
       placeholder="Search here...">

</body>
</html>
