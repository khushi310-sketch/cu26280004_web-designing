<!DOCTYPE html>
<html>
<head>
    <title>Data Entry Table</title>

<style>
table {
    width: 80%;
    margin: 30px ;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border: 1px solid gray;
}

th {
    background: navy;
    color: white;
}

tr:nth-child(even) {
    background: #eeeeee;
}

tr:hover {
    background: #cceeff;
}

input {
    padding: 6px;
    width: 90%;
}
</style>

</head>
<body>

<h1>Student Data</h1>

<form>

<table>

    <tr>
        <th>Name</th>
        <th>Roll No</th>
        <th>Course</th>
    </tr>

    <tr>
        <td><input type="text"></td>
        <td><input type="text"></td>
        <td><input type="text"></td>
    </tr>

    <tr>
        <td><input type="text"></td>
        <td><input type="text"></td>
        <td><input type="text"></td>
    </tr>

</table>

</form>

</body>
</html>
