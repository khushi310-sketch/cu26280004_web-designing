<!DOCTYPE html>
<html>
<head>
    <title>CSS Types</title>

    <link rel="stylesheet" href="style.css">

    <style>
        input {
            background-color: lightyellow;
        }

        .internal {
            color: blue;
        }
    </style>

</head>
<body>

<h1 style="color: red;">Contact Form</h1>

<form>

    <label class="internal">Name:</label>

    <input type="text">

    <br><br>

    <label>Email:</label>

    <input type="email">

    <br><br>

    <button type="submit">Send</button>

</form>

</body>
</html>
