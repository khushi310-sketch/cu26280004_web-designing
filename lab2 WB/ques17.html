<!DOCTYPE html>
<html>
<head>
    <title>Hidden Input</title>
</head>
<body>

<h1>Session Data Form</h1>

<form>

    <label>Name:</label>
    <input type="text" name="name">

    <input type="hidden"
           name="session_id"
           value="ABC123">

    <input type="hidden"
           name="user_role"
           value="student">

    <br><br>

    <input type="submit" value="Submit">

</form>

</body>
</html>
