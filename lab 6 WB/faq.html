    <div class="faq">

        <div class="faq-item">
            <h3 class="question">What is HTML?</h3>
            <p class="answer">
                HTML is used to create the structure of a webpage.
            </p>
        </div>

        <div class="faq-item">
            <h3 class="question">What is CSS?</h3>
            <p class="answer">
                CSS is used to style and design webpages.

        <div class="faq-item">
            <h3 class="question">What is JavaScript?</h3>

                JavaScript is used to add interactivity to websites.

    </div>
