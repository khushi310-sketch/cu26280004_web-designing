<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

<style>
body {
    background: #eeeeee;
    font-family: Arial;
}

.card {
    width: 300px;
    margin: 100px auto;
    padding: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px gray;
    position: relative;
}

.card h2 {
    text-align: center;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 10px;
    background: blue;
    color: white;
    border: none;
}

.close {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 20px;
}
</style>

</head>
<body>

<div class="card">

    <span class="close">×</span>

    <h2>Login</h2>

    <form>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">

        <button type="submit">Login</button>
    </form>

</div>

</body>
</html>
