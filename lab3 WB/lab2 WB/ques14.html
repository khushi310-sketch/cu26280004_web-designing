<!DOCTYPE html>
<html>
<head>
    <title>Range Slider</title>
</head>
<body>

<h1>Choose Your Age</h1>

<form>

    <label>Age:</label>

    <input type="range"
           id="age"
           min="1"
           max="100"
           value="18">

    <span id="ageValue">18 years</span>

    <br><br>

    <label>Number:</label>

    <input type="number"
           id="number"
           min="1"
           max="100"
           value="18">

    <span> years</span>

</form>

<script>
let age = document.getElementById("age");
let ageValue = document.getElementById("ageValue");

age.addEventListener("input", function() {
    ageValue.textContent = age.value + " years";
});
</script>

</body>
</html>
