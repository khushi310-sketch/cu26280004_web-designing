<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>

<style>
body {
    font-family: Arial;
}

form {
    width: 350px;
    margin: 30px;
}

input {
    margin: 15px 0;
}

button {
    padding: 12px 25px;
    background: green;
    color: white;
    border: none;
    border-radius: 5px;
    transition: 0.3s;
}

button:hover {
    background: darkgreen;
    transform: scale(1.05);
}

button:active {
    transform: scale(0.95);
}
</style>

</head>
<body>

<h1>Upload File</h1>

<form>

    <label>Select File:</label>
    <input type="file">

    <br>

    <button type="submit">Upload</button>

</form>

</body>
</html>
