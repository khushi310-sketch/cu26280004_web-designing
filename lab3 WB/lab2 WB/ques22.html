<!DOCTYPE html>
<html>
<head>
    <title>Newsletter Subscription</title>

<style>
body {
    font-family: Arial;
}

.newsletter {
    width: 350px;
    margin: 100px auto;
}

.field {
    position: relative;
    margin-top: 25px;
}

input {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid gray;
    border-radius: 5px;
}

label {
    position: absolute;
    left: 12px;
    top: 12px;
    color: gray;
    transition: 0.3s;
    pointer-events: none;
    background: white;
}

input:focus + label,
input:not(:placeholder-shown) + label {
    top: -10px;
    font-size: 12px;
    color: blue;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    background: blue;
    color: white;
    border: none;
}
</style>

</head>
<body>

<div class="newsletter">

<h1>Subscribe</h1>

<form>

    <div class="field">

        <input type="email"
               id="email"
               placeholder=" "
               required>

        <label for="email">
            Email Address
        </label>

    </div>

    <button type="submit">
        Subscribe
    </button>

</form>

</div>

</body>
</html>
